name: Build Zembo APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Locate project
        id: src
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            zipfile="$(ls -1 ./*.zip 2>/dev/null | head -n 1 || true)"
            if [ -z "$zipfile" ]; then
              echo "No project found. Upload the project .zip (or its extracted files) to the repository root."
              exit 1
            fi
            rm -rf _src
            mkdir _src
            unzip -q "$zipfile" -d _src
            found="$(find _src -maxdepth 3 -name settings.gradle.kts | head -n 1)"
            if [ -z "$found" ]; then
              echo "settings.gradle.kts not found inside $zipfile"
              exit 1
            fi
            echo "dir=$(dirname "$found")" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: ${{ steps.src.outputs.dir }}
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zembo-debug-apk
          path: ${{ steps.src.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Run unit tests
        if: always()
        working-directory: ${{ steps.src.outputs.dir }}
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: ${{ steps.src.outputs.dir }}/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
